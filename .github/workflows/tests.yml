name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    # macOS 26 and nothing else. The floor is `:sonoma` since 0.9.8 and this could in
    # principle run on macos-14 too — but the source build needs a full Xcode for SwiftUI's
    # macro plugins, and the runner images differ in which one is selected. One green job
    # that means something beats three that need explaining.
    strategy:
      matrix:
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # `--only-formulae` builds bottles and only runs on pull requests, so a push to main
      # checked the formula's *syntax* and never once built it. That is the half that
      # matters: a formula can be perfectly styled and still not compile, and the machine
      # this was written on cannot check — its Command Line Tools are older than the Xcode
      # it has selected, and Homebrew refuses on that alone. So the runner does it.
      #
      # `--HEAD` because there is no tagged release yet. When there is, this becomes a plain
      # `brew install nurkamol/tap/replay` and gains a second job for the stable path.
      - name: Install and test the CLI for real
        run: |
          brew install --HEAD --verbose nurkamol/tap/replay
          brew test nurkamol/tap/replay
          replay --version
          replay today --database /nonexistent/activity.db || test $? -eq 2

      # The application built from source. This is the claim that formula exists to make —
      # that an app compiled on the machine it runs on needs no Developer ID — so it is worth
      # proving on a runner that has never seen the project rather than asserting.
      #
      # `--formula` is required now and its absence is what broke this job. The token
      # `replay-app` belongs to the *cask*; the source formula was renamed to
      # `replay-app-source` so that a plain `brew install nurkamol/tap/replay-app` resolves to
      # the prebuilt app, which is what somebody typing it expects. Without the flag this
      # asked for a formula by a name only a cask now has: "No available formula with the
      # name nurkamol/tap/replay-app".
      - name: Install and test the application, built from source
        run: |
          brew install --HEAD --verbose --formula nurkamol/tap/replay-app-source
          # No `--formula` here: `brew test` does not take it, and does not need it —
          # nothing else is called `replay-app-source`.
          brew test nurkamol/tap/replay-app-source
          codesign --verify --deep --verbose=2 \
            "$(brew --prefix)/opt/replay-app-source/Replay.app"
          # Nothing built here is quarantined; if that ever changes, the premise is wrong.
          ! xattr -p com.apple.quarantine \
            "$(brew --prefix)/opt/replay-app-source/Replay.app" 2>/dev/null

      # And the prebuilt cask. It *is* a download, so Homebrew marks it — and then the cask's
      # own `postflight` clears the mark, which is the whole reason installing this way no
      # longer ends at a Gatekeeper dialog. So the assertion is that the flag is **gone**.
      #
      # It used to assert the opposite, and said so: "Quarantined, because Homebrew quarantines
      # cask downloads. If this ever stops being true the caveats are telling people to do
      # something pointless." That is exactly what happened — 0.9.9 added the postflight and
      # this job went red on the next push. The test was right to fail; it was describing the
      # old contract. Kept as an assertion rather than deleted, because a postflight that
      # silently stopped working would otherwise be invisible until somebody hit the dialog.
      - name: Install the prebuilt cask
        run: |
          brew install --cask --verbose nurkamol/tap/replay-app
          test -d /Applications/Replay.app
          /usr/bin/plutil -extract CFBundleShortVersionString raw \
            /Applications/Replay.app/Contents/Info.plist
          # No quarantine flag: the postflight removed it. If this starts failing, installs
          # are meeting "Apple could not verify Replay" again and the caveats are now wrong.
          ! xattr -p com.apple.quarantine /Applications/Replay.app 2>/dev/null
          # And the app it installed is the one that was signed, not an ad-hoc build.
          codesign --verify --deep --strict /Applications/Replay.app
          codesign -d -r- /Applications/Replay.app 2>&1 | grep -q "certificate leaf"

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
